# Builds the desktop app for macOS and Windows and publishes GitHub Release v<version> whenever the version in
# desktop/package.json changes on main (or when run by hand from the Actions tab).
# Installed copies update themselves from these releases (macOS needs a Developer ID-signed build; see desktop/README.md).
name: Release desktop app
on:
  push:
    branches: [main]
    paths: ["desktop/package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1   # one platform at a time, so both upload into the same GitHub Release without racing to create it
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # temporary while the macOS publish step is being fixed
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: bash sync_apps.sh
      - name: Build and publish
        run: |
          set -o pipefail
          npx electron-builder --config electron-builder.config.js ${{ matrix.target }} --publish always 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # surface the error as annotations (visible on the run page without opening the log)
            grep -nE "⨯|Error:|error " build.log | head -20 | while IFS= read -r line; do echo "::error title=electron-builder::${line:0:900}"; done
          fi
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          # macOS signing + notarization (optional; unsigned builds are produced when these are not set)
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
