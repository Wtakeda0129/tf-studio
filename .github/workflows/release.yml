# Builds the desktop app for macOS and Windows and publishes GitHub Release v<version> whenever the version in
# desktop/package.json changes on main (or when run by hand from the Actions tab).
# Installed copies update themselves from these releases (macOS needs a Developer ID-signed build; see desktop/README.md).
name: Release desktop app
on:
  push:
    branches: [main]
    paths: ["desktop/package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1   # one platform at a time, so both upload into the same GitHub Release without racing to create it
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: bash sync_apps.sh
      - name: Work around hdiutil "resource busy" on GitHub macOS runners
        if: matrix.os == 'macos-latest'
        run: |
          sudo mdutil -a -i off || true
          # XProtect / Spotlight scanning keeps freshly mounted DMG volumes busy; stop them for the duration of the build
          ( for i in $(seq 1 180); do sudo pkill -9 XProtect >/dev/null 2>&1 || true; sudo pkill -9 mds_stores >/dev/null 2>&1 || true; sleep 5; done ) &
      - name: Import the self-signed code-signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        env:
          P12: ${{ secrets.MAC_SELFSIGN_P12 }}
        run: |
          if [ -z "$P12" ]; then echo "::notice title=signing::No MAC_SELFSIGN_P12 secret, so the macOS app gets an ad-hoc signature"; exit 0; fi
          KC="$RUNNER_TEMP/tfsign.keychain-db"; KCPW=$(uuidgen)
          printf '%s' "$P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/tf.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/tf.p12" -k "$KC" -P tfstudio -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tf.p12"
          HASH=$(security find-certificate -c "Tf Studio (self-signed)" -Z "$KC" | awk '/SHA-1/{print $NF}')
          if [ -z "$HASH" ]; then echo "::error title=signing::certificate 'Tf Studio (self-signed)' not found in the secret"; exit 1; fi
          echo "::notice title=signing::Signing with the Tf Studio certificate $HASH"
          echo "TF_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "TF_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build and publish
        run: |
          set +e +o pipefail
          # use a signing certificate only when one is configured: an empty CSC_LINK makes electron-builder
          # resolve it to the working directory and fail with "<dir> not a file"
          if [ -n "$CERT_P12_BASE64" ]; then export CSC_LINK="$CERT_P12_BASE64" CSC_KEY_PASSWORD="$CERT_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --config electron-builder.config.js ${{ matrix.target }} --publish always > build.log 2>&1
          code=$?
          cat build.log
          if [ "$code" -ne 0 ]; then
            # surface the error as annotations (visible on the run page without opening the log)
            grep -nE "⨯|Error|error|failed|Cannot" build.log | head -20 | while IFS= read -r line; do echo "::error title=electron-builder::${line:0:900}"; done
            tail -12 build.log | while IFS= read -r line; do echo "::notice title=build tail::${line:0:900}"; done
          fi
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          # macOS signing + notarization (optional; unsigned builds are produced when these are not set)
          CERT_P12_BASE64: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # publish the draft only after every platform has uploaded its installer and update metadata
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          gh release view "v$v" --json assets --jq '.assets[].name'
          gh release edit "v$v" --draft=false --latest
