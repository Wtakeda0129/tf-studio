<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GARASU Beta · Data Analysis</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>

:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#dfe3e9; --grid:#e9ecf1; --soft:#f7f8fa;
  --accent:#2a6fdb; --accent-ink:#ffffff; --eq:#7a8696; --warn:#b42318; --warnbg:#fdecea; --ok:#1f7a3a; --okbg:#e8f5ec;
  --c1:#2a6fdb; --c2:#d9480f; --c3:#2b9348; --c4:#8e44ad; --c5:#b8860b; --c6:#0e8f9c; --c7:#c2185b; --c8:#546e7a;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e6ebf2; --muted:#93a1b3; --line:#2c3543; --grid:#252d39; --soft:#161b22;
  --accent:#5b9bff; --accent-ink:#0b1220; --eq:#8b98a9; --warn:#ff8f85; --warnbg:#3a1d1b; --ok:#6fd48b; --okbg:#173022;
  --c1:#5b9bff; --c2:#ff8a4c; --c3:#5fd17f; --c4:#c08be0; --c5:#e3b341; --c6:#4fd0dc; --c7:#f06292; --c8:#90a4ae; --shadow:none;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:2px 8px;font-size:12px} .btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.btn.icon{padding:1px 6px;font-size:13px;line-height:1.3}
header{display:flex;align-items:center;gap:14px;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15.5px;margin:0;font-weight:680}
.brand{display:flex;align-items:baseline;gap:7px;color:inherit;text-decoration:none}.brand span{font-size:12.5px;color:var(--muted);font-weight:600}
header .sp{flex:1}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 12px 4px 5px;cursor:pointer;text-align:left;min-width:150px}
.step .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--soft);border:1px solid var(--line)}
.step b{display:block;font-size:12.5px} .step small{display:block;color:var(--muted);font-size:11px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step[aria-current=true] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.done .num{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.menu{position:relative} .menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:260px;display:none}
.menu.open>div{display:block}
.menu button.item{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:6px;cursor:pointer}
.menu button.item:hover{background:var(--soft)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 0}
main{flex:1;display:grid;grid-template-columns:390px minmax(0,1fr);gap:12px;padding:10px 14px;min-height:0}
@media (min-width:981px){ body{height:100vh;overflow:hidden} #left,#right{overflow-y:auto;min-height:0} #left{padding-right:4px;scrollbar-gutter:stable} }
@media (max-width:980px){ main{grid-template-columns:1fr} .step{min-width:0} .step small{display:none} header{flex-wrap:wrap} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:10px}
.card>h2{margin:0;padding:8px 12px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>h2 .sub{text-transform:none;letter-spacing:0;font-weight:500}
.card .body{padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 8px} .full{grid-column:1/-1}
label.f{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
label.f>input,label.f>select,label.f>textarea,label.f>.inrow{display:block;margin-top:3px;width:100%}
input[type=number],input[type=text],select,textarea{padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13px;min-width:0}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
input[type=range]{accent-color:var(--accent);width:100%;margin:0}
.inrow{display:flex;gap:6px;align-items:center} .inrow>input[type=number]{width:74px;flex:1 1 60px;min-width:0} .inrow>input[type=range]{flex:1}
.inrow>select{flex:none;width:auto}
.note{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;color:#fff;background:var(--pc)}
/* segments */
.seg{border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:9px;padding:7px 9px 8px;margin-bottom:7px;background:var(--panel)}
.seg.sel{box-shadow:0 0 0 1.5px var(--pc)}
.seg .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.seg .top .desc{font-size:12px;color:var(--ink);font-weight:550;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.seg .res{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:5px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel)} .stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums} .stat span{font-size:10.5px;color:var(--muted)}
/* datasets */
.dsitem{border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:9px;padding:6px 9px;margin-bottom:6px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center}
.dsitem.sel{box-shadow:0 0 0 1.5px var(--pc)} .dsitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dsitem .meta{grid-column:2/4;font-size:11px;color:var(--muted)}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 8px}
.tabs2 button{border:none;background:none;padding:5px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;font-size:12px}
.tabs2 button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
/* params */
table.pt{width:100%;border-collapse:collapse;font-size:12.5px}
table.pt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
table.pt td{padding:3px 4px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.pt td input[type=number]{width:100%;font-size:12px;padding:3px 5px}
table.pt tr.fixed td input.b{opacity:.35}
table.pt .nm{white-space:nowrap}
table.pt td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{font-size:10.5px;color:var(--warn);font-weight:650}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;align-items:start}
.mcard input{margin-top:3px;accent-color:var(--accent)} .mcard b{font-size:12.5px} .mcard span{grid-column:2;font-size:11.5px;color:var(--muted)}
.mcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
/* right panel */
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rhead h3{margin:0;font-size:14px}
.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:1250px){.plots{grid-template-columns:1fr}}
@media (min-width:1900px){.plots.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plotcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;position:relative;min-width:0}
.plotcard h3{margin:0 0 2px;font-size:12.5px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:6px}
.plotcard svg{width:100%;height:auto;display:block;overflow:visible}
.plotbox,.resbox{position:relative}
.plotcard .plotbox svg{max-height:max(220px,calc((100vh - 330px)/2))}
.plotcard .resbox svg{max-height:120px}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:4px}
.legend i.dash{border-top-style:dashed} .legend i.dot{width:7px;height:7px;border-radius:50%;border:none;background:currentColor}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:5;display:none}
.axis text{fill:var(--muted);font-size:11px} .axlabel{fill:var(--ink);font-size:12px}
.empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.banner{padding:7px 11px;border-radius:8px;margin-bottom:8px;font-weight:550}
.banner.err{background:var(--warnbg);color:var(--warn)} .banner.ok{background:var(--okbg);color:var(--ok)}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px} .progress>div{height:100%;background:var(--accent);width:0;transition:width .15s}
.navbar{display:flex;justify-content:space-between;gap:8px;margin:4px 0 12px}
table.dt{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums} table.dt td,table.dt th{padding:2px 8px;border-bottom:1px solid var(--grid);text-align:right} table.dt th{color:var(--muted);font-weight:600}
table.metrics{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.metrics th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
table.metrics td{padding:3px 4px;border-bottom:1px solid var(--grid)} table.metrics td.num{text-align:right}
table.corr{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums} table.corr td,table.corr th{padding:4px 7px;text-align:center} table.corr th{color:var(--muted);font-weight:600}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.eqn{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;background:var(--soft);border-radius:7px;padding:7px 9px;margin-top:6px;overflow-x:auto;white-space:pre}
.plotcard.wide{grid-column:1/-1}
.cbar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:0 8px 6px 56px;flex-wrap:wrap}
.cbar i{display:inline-block;width:180px;height:10px;border-radius:2px}
.brand{flex-shrink:0}.brand h1{white-space:nowrap}
.beta-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:middle;line-height:1.5;align-self:center}

.dsitem .pill{min-width:34px;text-align:center}

/* ===== GARASU theme: paper, hinoki wood, enji (deep red), white plot panes. Appended after each page's own styles. ===== */
:root{
  --bg:#F3F1EC; --panel:#FFFFFF; --ink:#22252A; --muted:#6E6C66; --line:#E1D9CC; --grid:#EFE9DF; --soft:#F7F4EE; --code:#F5F2EC;
  --accent:#7A2632; --accent-ink:#FFFFFF; --frame:#3A3C41; --wood:#B48A58; --enji:#6E1F2B; --enji2:#86303C; --rail-ink:#E6C3C7;
  --shadow:none; --callout:#FBF7F4; --callout-line:#E7D6D2; --okbg:#EAF3EC; --ok:#2F6B3F;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --rail:88px;
}
:root[data-theme="dark"]{
  --bg:#16181B; --panel:#1F2226; --ink:#ECE8E1; --muted:#A39E95; --line:#34373C; --grid:#2A2D31; --soft:#1A1C20; --code:#1A1C20;
  --accent:#D27884; --accent-ink:#1A1012; --frame:#9A958C; --wood:#8E6B44; --enji:#4E1620; --enji2:#6B2431; --rail-ink:#D9AEB4;
  --callout:#241B1D; --callout-line:#4A2C31;
}
html{font-family:var(--sans)}
body{font-family:var(--sans)!important;padding-left:var(--rail)}
button,select,input,textarea{font-family:inherit}

/* ---- rail ---- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--enji);display:flex;flex-direction:column;align-items:stretch;padding:12px 0;gap:2px;z-index:50}
.rail .logo{display:block;width:58px;height:58px;margin:0 auto 4px}
.rail .logo img{width:58px;height:58px;display:block}
.rail .rb{display:block;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--rail-ink);margin-bottom:14px}
.rail a.rtool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;color:var(--rail-ink);font-size:12px;line-height:1.2;text-align:center;text-decoration:none}
.rail a.rtool svg{width:24px;height:24px}
.rail a.rtool:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail a.rtool.on{color:#fff;background:var(--enji2);box-shadow:inset 3px 0 var(--wood)}
.rail a:focus-visible{outline:2px solid #fff;outline-offset:-3px}

/* ---- tool header: name, step switch, controls; hinoki line underneath ---- */
body>header,header.top{background:var(--panel);border-bottom:2px solid var(--wood)!important}
body>header{min-height:58px;padding:8px 22px;gap:18px}
.brand h1,.brand .beta-badge{display:none}
.brand span{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--ink);letter-spacing:.01em}
.beta-badge{border-color:var(--accent);color:var(--accent)}
.stepper{gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap;background:var(--panel)}
.stepper .step{border:0;border-right:1px solid var(--line);border-radius:0;min-width:0;padding:6px 16px;gap:0;background:var(--panel);box-shadow:none}
.stepper .step:last-child{border-right:0}
.stepper .step .num{display:none}
.stepper .step b{font-size:13.5px;font-weight:600}
.stepper .step small{font-size:11.5px;max-width:170px}
.stepper .step[aria-current=true]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.stepper .step[aria-current=true] small{color:var(--rail-ink)}
.stepper .step.done b:after{content:" ✓";color:var(--ok);font-weight:600}
.stepper .step[aria-current=true].done b:after{color:var(--rail-ink)}
.chk{font-size:13px}

/* ---- surfaces ---- */
.btn{border-radius:6px}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.card{border-radius:8px;box-shadow:none;border-color:var(--line)}
.card>h2{text-transform:none!important;letter-spacing:0!important;font-size:14.5px;font-weight:600;color:var(--ink);padding:10px 14px}
.card>h2 .sub{color:var(--muted);font-weight:400;font-size:12.5px}
.plotcard{border-radius:8px}
.plotcard h3{font-size:13.5px;font-weight:600}
table.pt th,table.metrics th{text-transform:none;letter-spacing:0;font-size:11.5px}
.pill{letter-spacing:.02em}
input[type=number],input[type=text],select,textarea{background:var(--panel)}
.axis text{font-family:var(--sans)}
.axlabel{font-family:var(--sans)}

@media (max-width:760px){
  body{padding-left:0;padding-top:58px}
  .rail{bottom:auto;right:0;width:auto;height:58px;flex-direction:row;padding:0 8px;align-items:center;gap:0}
  .rail .logo{width:40px;height:40px;margin:0 8px 0 0} .rail .logo img{width:40px;height:40px} .rail .rb{display:none}
  .rail a.rtool{flex:1;padding:6px 2px;font-size:10.5px;gap:2px} .rail a.rtool svg{width:20px;height:20px}
  .rail a.rtool.on{box-shadow:inset 0 -3px var(--wood)}
}

/* ---- labels in sentence case (no tracked capitals) ---- */
.card>h2,details.card>summary.h2,.tp,.partlabel,.toc b{text-transform:none!important;letter-spacing:0!important}
details.card>summary.h2{font-size:14.5px;font-weight:600;color:var(--ink)}
.toc b{font-size:13px;color:var(--ink);font-weight:600}
.partlabel{font-size:13.5px;font-weight:600}
.tp{font-size:12.5px;font-weight:600}
#themeBtn{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-width:30px}

/* ---- Learn: serif headings on the paper ---- */
.prose h2,h2.parth,.layout main>h2,main>section>h2{font-family:var(--serif);font-weight:600;letter-spacing:0}
.lede{color:var(--muted)}
.callout{border-radius:8px}
header.top .in{max-width:none;padding:10px 28px}

/* ---- projects: header switcher, contents drawer, dialogs ---- */
.gp-bar{position:relative;display:flex;align-items:center;gap:8px;flex-shrink:0}
.gp-chip{display:flex;align-items:baseline;gap:7px;max-width:340px;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.gp-chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-chip:hover{border-color:var(--accent)}
.gp-l{font-size:11.5px;color:var(--muted)}
.gp-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(30,20,15,.14);padding:6px;min-width:300px;max-height:70vh;overflow:auto}
.gp-bar.open .gp-menu{display:block}
.gp-menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.gp-h{font-size:12px;color:var(--muted);padding:4px 8px}
.gp-item{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:5px;cursor:pointer;font:inherit;color:var(--ink)}
.gp-item:hover{background:var(--soft)} .gp-item.on{box-shadow:inset 3px 0 var(--accent);background:var(--soft)}
.gp-item b{display:block;font-weight:600} .gp-item span{font-size:12px;color:var(--muted)} .gp-item.danger{color:var(--warn,#b42318)}
.gp-drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--panel);border-left:2px solid var(--wood);z-index:70;overflow:auto;padding:16px 18px 30px;box-shadow:-10px 0 30px rgba(30,20,15,.12)}
.gp-dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gp-dh h3{margin:0;font-family:var(--serif);font-weight:600;font-size:21px}
.gp-note{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.gp-drawer section{margin-top:14px} .gp-drawer h4{margin:0 0 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.gp-it{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px}
.gp-in b{display:block;font-weight:600} .gp-in span{display:block;font-size:12.5px;color:var(--muted)} .gp-in .gp-d{font-size:11.5px}
.gp-act{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.gp-empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);margin-top:14px;font-size:14px}
.gp-modal{position:fixed;inset:0;background:rgba(30,25,20,.32);z-index:90;display:grid;place-items:center;padding:16px}
.gp-dialog{background:var(--panel);border-radius:10px;border-top:3px solid var(--wood);padding:18px 20px;width:min(440px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.gp-dialog h3{margin:0 0 10px;font-family:var(--serif);font-weight:600;font-size:19px} .gp-dialog p{margin:0 0 12px;color:var(--muted)}
.gp-f{display:block;font-size:13px;color:var(--muted)} .gp-f input{display:block;width:100%;margin-top:4px;padding:7px 9px;font-size:15px;border:1px solid var(--line);border-radius:6px}
.gp-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.gp-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:7px;z-index:95;font-size:14px;transition:opacity .4s}
.gp-toast.out{opacity:0}
@media (max-width:980px){.gp-chip{max-width:200px}}
.px-menu{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(30,20,15,.14);padding:4px;width:150px}
.px-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:5px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.px-menu button:hover{background:var(--soft)}
/* with a project bar the header takes two rows: name, project and controls on top; the step switch spans the second row */
body>header:has(.gp-bar):has(.stepper){flex-wrap:wrap;row-gap:8px;padding-bottom:10px}
body>header:has(.gp-bar) .stepper{order:99;flex:1 1 100%;display:flex}
body>header:has(.gp-bar) .stepper .step{flex:1 1 0;justify-content:center;text-align:center}
body>header:has(.gp-bar) .stepper .step small{max-width:none}
</style>

  const fontCSS = () => FONTS ? `<style>${FONTS.map(f => `@font-face{font-family:'Source Sans 3';font-weight:${f.w};src:url(data:font/woff2;base64,${f.b}) format('woff2')${f.r ? `;unicode-range:${f.r}` : ""}}`).join("")}</style>` : "";
  function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

  // a self-contained SVG: the plot with CSS variables resolved, plus the title above and the legend below
  function standalone(svg, cfg, series) {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    const ink = v("--ink") || "#22252a", muted = v("--muted") || "#6e6c66";
    const vb = (svg.getAttribute("viewBox") || "0 0 560 310").split(/\s+/).map(Number), W = vb[2], H = vb[3];
    let inner = new XMLSerializer().serializeToString(svg);
    inner = inner.replace(/var\((--[a-z0-9-]+)\)/g, (_, n) => v(n) || "#000")
      .replace(/<g class="hov"[\s\S]*?<\/g>/, "").replace(/<rect class="cap"[^>]*\/>/, "")
      .replace(/<g class="axis">/, `<g class="axis" fill="${muted}" font-size="11">`)
      .replace(/<text class="axlabel"/g, `<text fill="${ink}" font-size="12"`).replace(/<text class="axis"/g, "<text")
      .replace(/^<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
    const title = plain(cfg.title || ""), tH = title ? 26 : 6;
    const items = (series || []).filter(s => s.name && s.x && s.x.length);
    // legend rows: estimate text width (≈6.2 px per character at 11.5 px)
    const rows = [[]]; let x = 0; const maxW = W - 16;
    items.forEach(s => { const w = 30 + plain(s.name).length * 6.2 + 16; if (x + w > maxW && rows[rows.length - 1].length) { rows.push([]); x = 0; } rows[rows.length - 1].push({ s, x }); x += w; });
    const lH = items.length ? rows.length * 18 + 6 : 0, TH = tH + H + lH;
    let leg = "";
    rows.forEach((r, k) => r.forEach(({ s, x }) => {
      const y = tH + H + 12 + k * 18, X = 8 + x;
      leg += s.pts ? `<circle cx="${X + 10}" cy="${y}" r="3.5" fill="${s.color}"/>` : `<line x1="${X}" x2="${X + 22}" y1="${y}" y2="${y}" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
      leg += `<text x="${X + 28}" y="${y + 4}" fill="${muted}" font-size="11.5">${GLabel.svg(esc(plain(s.name)))}</text>`;
    }));
    return { W, H: TH, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${TH}" viewBox="0 0 ${W} ${TH}" font-family="'Source Sans 3', Helvetica, Arial, sans-serif">${fontCSS()}` +
      `<rect width="100%" height="100%" fill="#ffffff"/>${title ? `<text x="8" y="17" fill="${ink}" font-size="13.5" font-weight="600">${GLabel.svg(esc(title))}</text>` : ""}` +
      `<g transform="translate(0 ${tH})">${inner}</g>${leg}</svg>` };
  }
  function raster(svg, cfg, series, type) {
    const st = standalone(svg, cfg, series), scale = 3, img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = Math.round(st.W * scale); c.height = Math.round(st.H * scale);
      const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => dl(b, `${slug(cfg.title || cfg.id)}.${type === "image/png" ? "png" : "jpg"}`), type, 0.95);
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(st.svg);
  }
  function csv(cfg, series) {
    const S = (series || []).filter(s => s.x && s.x.length);
    const q = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    const xn = plain(cfg.xshort || "x"), yn = plain(cfg.yshort || "y");
    const L = [`# ${plain(cfg.title || cfg.id || "")}`, `# x: ${plain(cfg.xlabel || xn)}`, `# y: ${plain(cfg.ylabel || yn)}`];
    L.push(S.map((s, i) => { const n = plain(s.name) || `series ${i + 1}`; return `${q(n + " " + xn)},${q(n + " " + yn)}`; }).join(","));
    const n = Math.max(0, ...S.map(s => s.x.length));
    for (let k = 0; k < n; k++) L.push(S.map(s => k < s.x.length ? `${isFinite(s.x[k]) ? s.x[k] : ""},${isFinite(s.y[k]) ? s.y[k] : ""}` : ",").join(","));
    dl(new Blob([L.join("\n")], { type: "text/csv" }), `${slug(cfg.title || cfg.id)}.csv`);
  }
  let open = null;
  function menu(btn, svg, cfg, series) {
    if (open) { open.remove(); const was = open._btn; open = null; if (was === btn) return; }
    const m = document.createElement("div"); m.className = "px-menu"; m._btn = btn;
    m.innerHTML = `<button data-f="png">PNG image</button><button data-f="jpg">JPEG image</button><button data-f="svg">SVG (vector)</button><button data-f="csv">CSV data</button>`;
    const r = btn.getBoundingClientRect(); m.style.top = (r.bottom + window.scrollY + 4) + "px"; m.style.left = Math.max(8, r.right + window.scrollX - 150) + "px";
    document.body.appendChild(m); open = m;
    m.addEventListener("click", e => { const f = e.target.closest("[data-f]"); if (!f) return; m.remove(); open = null;
      if (f.dataset.f === "svg") dl(new Blob([standalone(svg, cfg, series).svg], { type: "image/svg+xml" }), `${slug(cfg.title || cfg.id)}.svg`);
      else if (f.dataset.f === "png") raster(svg, cfg, series, "image/png");
      else if (f.dataset.f === "jpg") raster(svg, cfg, series, "image/jpeg");
      else csv(cfg, series); });
  }
  document.addEventListener("mousedown", e => { if (open && !open.contains(e.target) && e.target !== open._btn) { open.remove(); open = null; } });
  window.PanelExport = { menu, standalone, csv };
})();

</script>
<script>
/* ============================================================
   GARASU · projects (shared by Data Analysis, the Fitter and the home page)
   A project is a named collection of items saved on this computer:
     cp-normalized   one normalized DSC run (C_p^N, T_f, glass/liquid baselines)    — from Data Analysis
     an-session      the whole Data Analysis state (raw runs, ranges, settings)     — from Data Analysis
     recovery        enthalpy-recovery results (ΔH, T_f, φ, KWW)                   — from Data Analysis
     relax-fit       property relaxation data and stretched-exponential fit         — from Data Analysis
     fit-result      model vs data, parameters ± SE, quality, baselines, session    — from the Fitter
   Storage: IndexedDB (database "garasu"), with a localStorage fallback. The current project id is in
   localStorage; other open pages (or desktop views) are told about changes through a BroadcastChannel.
   Projects can be exported to / imported from a single .garasu.json file.
   ============================================================ */
(function () {
  "use strict";
  const DBN = "garasu", ST = "projects", CUR = "garasu.currentProject";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const now = () => new Date().toISOString();
  const fmtDate = s => { try { const d = new Date(s); return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); } catch (e) { return s; } };

  /* ---------------- storage ---------------- */
  let dbp = null;
  function idb() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("no IndexedDB"));
      const rq = indexedDB.open(DBN, 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains(ST)) db.createObjectStore(ST, { keyPath: "id" }); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    }).catch(e => { console.warn("GARASU projects: IndexedDB unavailable, using localStorage", e); return null; });
    return dbp;
  }
  const lsKey = "garasu.projects";
  const lsAll = () => { try { return JSON.parse(localStorage.getItem(lsKey) || "[]"); } catch (e) { return []; } };
  const lsPut = arr => localStorage.setItem(lsKey, JSON.stringify(arr));
  async function all() {
    const db = await idb(); if (!db) return lsAll();
    return new Promise((res, rej) => { const rq = db.transaction(ST).objectStore(ST).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); });
  }
  async function get(id) {
    if (!id) return null; const db = await idb(); if (!db) return lsAll().find(p => p.id === id) || null;
    return new Promise((res, rej) => { const rq = db.transaction(ST).objectStore(ST).get(id); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); });
  }
  async function put(p) {
    p.updated = now(); const db = await idb();
    if (!db) { const a = lsAll().filter(x => x.id !== p.id); a.push(p); lsPut(a); }
    else await new Promise((res, rej) => { const tx = db.transaction(ST, "readwrite"); tx.objectStore(ST).put(p); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    notify(); return p;
  }
  async function del(id) {
    const db = await idb();
    if (!db) lsPut(lsAll().filter(x => x.id !== id));
    else await new Promise((res, rej) => { const tx = db.transaction(ST, "readwrite"); tx.objectStore(ST).delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    if (curId() === id) setCur(null); notify();
  }

  /* ---------------- current project and change notification ---------------- */
  const curId = () => { try { return localStorage.getItem(CUR) || null; } catch (e) { return null; } };
  function setCur(id) { try { id ? localStorage.setItem(CUR, id) : localStorage.removeItem(CUR); } catch (e) {} notify(); }
  let bc = null; try { bc = new BroadcastChannel("garasu-projects"); } catch (e) {}
  const listeners = [];
  function notify() { try { bc && bc.postMessage("changed"); } catch (e) {} fire(); }
  function fire() { listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); refreshUI(); }
  if (bc) bc.onmessage = () => fire();
  window.addEventListener("storage", e => { if (e.key === CUR || e.key === lsKey) fire(); });

  /* ---------------- public API ---------------- */
  const GP = {
    list: async () => (await all()).map(p => ({ id: p.id, name: p.name, created: p.created, updated: p.updated, n: (p.items || []).length })).sort((a, b) => (b.updated || "").localeCompare(a.updated || "")),
    get, currentId: curId,
    current: async () => get(curId()),
    open(id) { setCur(id); },
    async create(name, notes) { const p = { id: uid(), name: name || "Untitled project", notes: notes || "", created: now(), updated: now(), items: [] }; await put(p); setCur(p.id); return p; },
    async rename(id, name) { const p = await get(id); if (!p) return; p.name = name; await put(p); },
    remove: del,
    // add an item to the current project; items with the same type and key replace the earlier version
    async addItem(it) {
      const p = await GP.current(); if (!p) throw new Error("No project is open.");
      const item = { id: uid(), created: now(), ...it };
      if (it.key) { const old = p.items.find(x => x.type === it.type && x.key === it.key); if (old) { item.id = old.id; item.created = old.created; item.revised = now(); p.items = p.items.filter(x => x !== old); } }
      p.items.push(item); await put(p); return item;
    },
    async item(id) { const p = await GP.current(); return p ? p.items.find(x => x.id === id) || null : null; },
    async deleteItem(id) { const p = await GP.current(); if (!p) return; p.items = p.items.filter(x => x.id !== id); await put(p); },
    async exportFile(id) {
      const p = await get(id || curId()); if (!p) return;
      download(new Blob([JSON.stringify({ format: "garasu-project", version: 1, exported: now(), project: p })], { type: "application/json" }), `${safe(p.name)}.garasu.json`);
    },
    async importFile(file) {
      const obj = JSON.parse(await file.text());
      const p = obj && obj.format === "garasu-project" ? obj.project : null; if (!p || !Array.isArray(p.items)) throw new Error("This is not a GARASU project file.");
      const ex = await get(p.id); if (ex) { p.id = uid(); p.name = p.name + " (imported)"; }
      await put(p); setCur(p.id); return p;
    },
    onChange(f) { listeners.push(f); },
    register(type, actions) { (HANDLERS[type] = HANDLERS[type] || []).push(...actions); refreshUI(); },
    csv: itemCSV, download, safe, esc, fmtDate,
    ask, confirmBox, toast,
  };
  window.GP = GP;
  function safe(s) { return String(s || "project").replace(/[^\w\- .()]+/g, "_").trim().slice(0, 80) || "project"; }
  function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

  /* ---------------- item descriptions and CSV ---------------- */
  const TYPES = {
    "cp-normalized": { label: "Normalized heat capacity", tool: "analysis" },
    "an-session": { label: "Data Analysis sessions", tool: "analysis" },
    "recovery": { label: "Enthalpy recovery", tool: "analysis" },
    "relax-fit": { label: "Property relaxation fits", tool: "analysis" },
    "fit-result": { label: "Fit results", tool: "fitter" },
  };
  const ORDER = ["cp-normalized", "fit-result", "recovery", "relax-fit", "an-session"];
  const TOOLNAME = { analysis: "Data Analysis", fitter: "Fitter" };
  const HANDLERS = {};
  function itemCSV(it) {
    const d = it.data || {}, L = [];
    const row = a => L.push(a.map(v => typeof v === "string" && /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : (v == null || (typeof v === "number" && !isFinite(v)) ? "" : v)).join(","));
    if (it.type === "cp-normalized") {
      L.push(`# ${it.name}`, `# scan: ${d.kind}, |q| = ${d.q} K/min${d.ta ? `, annealed ${d.ta} s at ${d.Ta} K` : ""}`,
        `# glass line HF_g = a + b*T: a = ${d.baseline.glass.a}, b = ${d.baseline.glass.b}, range ${d.baseline.glass.range.join("-")} K`,
        `# liquid line HF_l = a + b*T: a = ${d.baseline.liquid.a}, b = ${d.baseline.liquid.b}, range ${d.baseline.liquid.range.join("-")} K`,
        `# Tf' = ${d.TfPrime} K, midpoint = ${d.Tmid} K, dCp = ${d.dCp} ${d.cpUnit || ""}`);
      row(["T_K", `HF_${d.hfUnit || "raw"}`, "Cp_norm", "Tf_K"]); d.T.forEach((t, i) => row([t, d.HF[i], d.cpN[i], d.Tf[i]]));
    } else if (it.type === "fit-result") {
      L.push(`# ${it.name}`, `# model: ${d.modelName}, ${d.mode === "fit" ? "fitted" : "computed with chosen parameters"}; weighted R2 = ${d.quality && d.quality.R2_weighted}`);
      Object.entries(d.parameters || {}).forEach(([k, p]) => L.push(`# ${k} = ${p.value}${p.free ? (p.se != null ? ` ± ${p.se}` : p.grid_step ? ` (free, grid search in steps of ${p.grid_step}; no standard error)` : " (free)") : " (fixed)"}`));
      row(["dataset", "x", "y_data", "y_model", "residual"]);
      (d.datasets || []).forEach(s => s.x.forEach((x, k) => row([s.name, x, s.y[k], s.yModel[k], s.yModel[k] == null ? null : s.y[k] - s.yModel[k]])));
    } else if (it.type === "recovery") {
      L.push(`# ${it.name}`, `# reference: ${d.reference}, Tf'(ref) = ${d.TfRef} K, dCp = ${d.dCp}, Ta = ${d.Ta} K${d.kww ? `, KWW tau = ${d.kww.tau} s, beta = ${d.kww.beta}` : ""}`);
      row(["t_a_s", `dH_${d.hUnit}`, "dH_over_dCp_K", "Tf_from_dH_K", "Tf_area_K", "phi"]); (d.rows || []).forEach(r => row([r.ta, r.dH, r.dT, r.TfH, r.TfArea, r.phi]));
    } else if (it.type === "relax-fit") {
      L.push(`# ${it.name}`, `# fit: tau = ${d.fit && d.fit.tau} s, beta = ${d.fit && d.fit.beta}, V0 = ${d.fit && d.fit.v0}, Vinf = ${d.fit && d.fit.vinf}, R2 = ${d.fit && d.fit.R2}`);
      row(["t_s", d.pu || "value", "phi", "fit"]); d.t.forEach((t, k) => row([t, d.v[k], d.phi ? d.phi[k] : null, d.yfit ? d.yfit[k] : null]));
    } else return null;
    return L.join("\n");
  }

  /* ---------------- small dialogs (window.prompt does not exist in the desktop app) ---------------- */
  function modal(html, onReady) {
    const w = document.createElement("div"); w.className = "gp-modal"; w.innerHTML = `<div class="gp-dialog" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(w); const close = () => w.remove(); onReady(w, close);
    w.addEventListener("mousedown", e => { if (e.target === w) close(); });
    w.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
    return close;
  }
  function ask(title, label, value, okLabel) {
    return new Promise(res => modal(`<h3>${esc(title)}</h3><label class="gp-f">${esc(label)}<input type="text" value="${esc(value || "")}"></label>
      <div class="gp-row"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${esc(okLabel || "OK")}</button></div>`, (w, close) => {
      const inp = w.querySelector("input"); inp.focus(); inp.select();
      const ok = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } close(); res(v); };
      w.querySelector("[data-ok]").onclick = ok; w.querySelector("[data-x]").onclick = () => { close(); res(null); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
    }));
  }
  function confirmBox(title, text, okLabel) {
    return new Promise(res => modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="gp-row"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${esc(okLabel || "OK")}</button></div>`, (w, close) => {
      w.querySelector("[data-ok]").onclick = () => { close(); res(true); }; w.querySelector("[data-x]").onclick = () => { close(); res(false); }; w.querySelector("[data-ok]").focus();
    }));
  }
  function toast(msg) { const t = document.createElement("div"); t.className = "gp-toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.classList.add("out"), 2600); setTimeout(() => t.remove(), 3200); }

  /* ---------------- header switcher and contents drawer ---------------- */
  let bar = null, drawerOpen = false;
  const TOOL = (document.querySelector(".rail a.rtool.on") || {}).dataset ? (document.querySelector(".rail a.rtool.on") || { dataset: {} }).dataset.tool || "home" : "home";
  function mount() {
    const host = document.querySelector("body>header") || document.querySelector("header.top .wrap") || document.querySelector("header.top .in");
    if (!host || bar) return;
    bar = document.createElement("div"); bar.className = "gp-bar";
    const brand = host.querySelector(".brand"); brand ? brand.after(bar) : host.appendChild(bar);
    bar.addEventListener("click", onBarClick);
    document.addEventListener("click", e => { if (bar && !bar.contains(e.target)) bar.classList.remove("open"); });
    refreshUI();
  }
  let rq = 0;
  async function refreshUI() {
    if (!bar) return; const my = ++rq;
    const [p, list] = await Promise.all([GP.current(), GP.list()]); if (my !== rq) return;
    const open = bar.classList.contains("open");
    bar.innerHTML = `<button class="gp-chip" data-gp="menu" title="Projects keep your normalized data, fits and sessions together">
        <span class="gp-l">Project</span><b>${p ? esc(p.name) : "none"}</b><span aria-hidden="true">▾</span></button>
      ${p ? `<button class="btn small" data-gp="contents" title="Everything saved in this project">Contents · ${p.items.length}</button>` : `<button class="btn small" data-gp="new">New project</button>`}
      <div class="gp-menu">
        ${list.length ? `<div class="gp-h">Open a project</div>${list.slice(0, 12).map(x => `<button class="gp-item ${p && x.id === p.id ? "on" : ""}" data-gp="open" data-id="${x.id}"><b>${esc(x.name)}</b><span>${x.n} item${x.n === 1 ? "" : "s"} · ${esc(fmtDate(x.updated))}</span></button>`).join("")}<hr>` : ""}
        <button class="gp-item" data-gp="new">New project…</button>
        ${p ? `<button class="gp-item" data-gp="rename">Rename “${esc(p.name)}”…</button><button class="gp-item" data-gp="export">Export project file (.garasu.json)</button>` : ""}
        <label class="gp-item" style="cursor:pointer">Import project file…<input type="file" accept=".json,.garasu.json" data-gp-import hidden></label>
        ${p ? `<button class="gp-item" data-gp="close">Close project</button><hr><button class="gp-item danger" data-gp="delete">Delete “${esc(p.name)}”…</button>` : ""}
      </div>`;
    if (open) bar.classList.add("open");
    const imp = bar.querySelector("[data-gp-import]");
    if (imp) imp.onchange = async () => { const f = imp.files[0]; if (!f) return; try { const q = await GP.importFile(f); toast(`Imported “${q.name}”`); } catch (e) { toast(e.message); } };
    if (drawerOpen) renderDrawer(p);
    document.dispatchEvent(new CustomEvent("garasu-project", { detail: p }));
  }
  async function onBarClick(e) {
    const b = e.target.closest("[data-gp]"); if (!b) return; const a = b.dataset.gp; const p = await GP.current();
    if (a === "menu") { bar.classList.toggle("open"); return; }
    bar.classList.remove("open");
    if (a === "new") { const n = await ask("New project", "Name", "", "Create"); if (n) { await GP.create(n); toast(`Project “${n}” created`); } }
    else if (a === "open") GP.open(b.dataset.id);
    else if (a === "rename" && p) { const n = await ask("Rename project", "Name", p.name, "Rename"); if (n) await GP.rename(p.id, n); }
    else if (a === "export" && p) GP.exportFile(p.id);
    else if (a === "close") setCur(null);
    else if (a === "delete" && p) { if (await confirmBox("Delete project", `Delete “${p.name}” and its ${p.items.length} items from this computer? Export it first if you may need it again.`, "Delete")) { await GP.remove(p.id); toast("Project deleted"); } }
    else if (a === "contents") { drawerOpen = true; renderDrawer(p); }
  }
  function renderDrawer(p) {
    let d = document.querySelector(".gp-drawer");
    if (!p) { if (d) d.remove(); drawerOpen = false; return; }
    if (!d) { d = document.createElement("aside"); d.className = "gp-drawer"; document.body.appendChild(d); d.addEventListener("click", onDrawerClick); }
    const groups = ORDER.map(t => [t, p.items.filter(x => x.type === t)]).filter(g => g[1].length);
    d.innerHTML = `<div class="gp-dh"><div><div class="gp-l">Project</div><h3>${esc(p.name)}</h3></div><button class="btn icon" data-gd="close" title="Close">×</button></div>
      <p class="gp-note">Created ${esc(fmtDate(p.created))} · saved on this computer. Use <b>Export project file</b> in the project menu to back it up or share it.</p>
      ${groups.length ? groups.map(([t, items]) => `<section><h4>${esc(TYPES[t] ? TYPES[t].label : t)}</h4>${items.slice().reverse().map(it => itemRow(it)).join("")}</section>`).join("")
        : `<div class="gp-empty">Nothing saved yet. In Data Analysis, normalize your scans and click <b>Save to project</b>; in the Fitter, use data from the project and save the fit result.</div>`}`;
  }
  function itemRow(it) {
    const acts = (HANDLERS[it.type] || []).filter(h => !h.when || h.when(it));
    const home = TYPES[it.type] && TYPES[it.type].tool;
    const goto = !acts.length && home && home !== TOOL ? `<button class="btn small" data-gd="goto" data-id="${it.id}" data-tool="${home}">Open in ${TOOLNAME[home]}</button>` : "";
    const csv = itemCSV({ ...it, data: { ...(it.data || {}), T: [], HF: [], cpN: [], Tf: [], t: [], v: [], datasets: [], rows: [] } }) !== null;
    return `<div class="gp-it"><div class="gp-in"><b>${esc(it.name)}</b><span>${window.GLabel ? GLabel.html(esc(it.summary || "")) : esc(it.summary || "")}</span><span class="gp-d">${esc(fmtDate(it.revised || it.created))}${it.revised ? " (updated)" : ""}</span></div>
      <div class="gp-act">${acts.map((h, k) => `<button class="btn small ${k === 0 ? "primary" : ""}" data-gd="act" data-k="${k}" data-id="${it.id}">${esc(h.label)}</button>`).join("")}${goto}
      ${csv ? `<button class="btn small" data-gd="csv" data-id="${it.id}">CSV</button>` : ""}<button class="btn small" data-gd="json" data-id="${it.id}">JSON</button>
      <button class="btn icon danger" data-gd="del" data-id="${it.id}" title="Delete from project">×</button></div></div>`;
  }
  async function onDrawerClick(e) {
    const b = e.target.closest("[data-gd]"); if (!b) return; const a = b.dataset.gd;
    if (a === "close") { drawerOpen = false; document.querySelector(".gp-drawer").remove(); return; }
    const it = await GP.item(b.dataset.id); if (!it) return;
    if (a === "act") { const acts = (HANDLERS[it.type] || []).filter(h => !h.when || h.when(it)); const h = acts[+b.dataset.k]; if (h) { drawerOpen = false; document.querySelector(".gp-drawer").remove(); await h.run(it); } }
    else if (a === "goto") location.href = `${b.dataset.tool}.html#open=${it.id}`;
    else if (a === "csv") { const s = itemCSV(it); if (s) download(new Blob([s], { type: "text/csv" }), `${safe(it.name)}.csv`); }
    else if (a === "json") download(new Blob([JSON.stringify(it, null, 1)], { type: "application/json" }), `${safe(it.name)}.json`);
    else if (a === "del") { if (await confirmBox("Delete item", `Remove “${it.name}” from this project?`, "Delete")) await GP.deleteItem(it.id); }
  }

  /* ---------------- open an item from a link: tool.html#open=<item id> ---------------- */

<script>
/* ============================================================
   GARASU · Data Analysis — numerical core (no DOM)
   - parse pasted / uploaded tables
   - DSC heat flow: linear glass and liquid baselines → normalized C_p^N = (HF − HF_g)/(HF_l − HF_g),
     fictive temperature T_f(T) by integration (Moynihan area matching), limiting T_f′
   - enthalpy recovery: aged heating scan aligned to the unaged reference, ΔHF(T), ΔH = ∫ΔHF dT / q
   - KWW fits of φ(t) and of property relaxation V(t) = V∞ + (V₀ − V∞)·exp[−(t/τ)^β]
   ============================================================ */
const AN = (function () {
  /* ---------- tables ---------- */
  function parseTable(text) {
    const rows = [], lines = String(text || "").split(/\r?\n/);
    let names = null;
    for (const raw of lines) {
      const line = raw.trim(); if (!line) continue;
      // delimiters: comma, semicolon or tab when present (headers may contain spaces), otherwise whitespace
      const tok = (/[,;\t]/.test(line) ? line.split(/\s*[,;\t]\s*/) : line.split(/\s+/)).map(s => s.trim()).filter(s => s !== "");
      const num = tok.map(s => Number(s.replace(/^"|"$/g, "")));
      const nNum = num.filter(v => isFinite(v)).length;
      if (nNum >= 2 && nNum >= tok.length - 1) rows.push(num);
      else if (!rows.length && tok.length >= 2) names = tok.map(s => s.replace(/^"|"$/g, ""));
    }
    const nc = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const cols = Array.from({ length: nc }, (_, j) => rows.map(r => (j < r.length ? r[j] : NaN)));
    const nm = Array.from({ length: nc }, (_, j) => (names && names[j]) || `column ${j + 1}`);
    return { cols, names: nm, n: rows.length };
  }

  /* ---------- small numerics ---------- */
  function linfit(x, y) {   // y = a + b x
    let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < x.length; i++) { const X = x[i], Y = y[i]; if (!isFinite(X) || !isFinite(Y)) continue; n++; sx += X; sy += Y; sxx += X * X; sxy += X * Y; }
    if (n < 2) return null; const d = n * sxx - sx * sx; if (!(Math.abs(d) > 0)) return { a: sy / n, b: 0, n };
    const b = (n * sxy - sx * sy) / d; return { a: (sy - b * sx) / n, b, n };
  }
  function interp(xs, ys, x) {   // xs ascending
    const n = xs.length; if (n < 2 || !(x >= xs[0] && x <= xs[n - 1])) return NaN;
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= x) lo = m; else hi = m; }
    const d = xs[hi] - xs[lo]; return d > 0 ? ys[lo] + (x - xs[lo]) / d * (ys[hi] - ys[lo]) : ys[lo];
  }
  function trapz(x, y, a, b) {   // ∫_a^b y dx over ascending x (linear interpolation at the ends)
    if (!(b > a)) return 0; let s = 0;
    const pts = [[a, interp(x, y, a)]];
    for (let i = 0; i < x.length; i++) if (x[i] > a && x[i] < b) pts.push([x[i], y[i]]);
    pts.push([b, interp(x, y, b)]);
    for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; if (isFinite(y0) && isFinite(y1)) s += (x1 - x0) * (y0 + y1) / 2; }
    return s;
  }
  function sortByX(x, y) { const idx = x.map((_, i) => i).filter(i => isFinite(x[i]) && isFinite(y[i])).sort((a, b) => x[a] - x[b]); return { x: idx.map(i => x[i]), y: idx.map(i => y[i]) }; }
  function inRange(x, r) { return x >= Math.min(r[0], r[1]) && x <= Math.max(r[0], r[1]); }
  function nelderMead(f, x0, step, iters) {
    const n = x0.length; let P = [x0.slice()]; for (let i = 0; i < n; i++) { const p = x0.slice(); p[i] += step[i]; P.push(p); }
    let F = P.map(f);
    for (let it = 0; it < (iters || 400); it++) {
      const o = F.map((v, i) => i).sort((a, b) => F[a] - F[b]); P = o.map(i => P[i]); F = o.map(i => F[i]);
      if (Math.abs(F[n] - F[0]) < 1e-14 * (1 + Math.abs(F[0]))) break;
      const c = Array(n).fill(0); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) c[j] += P[i][j] / n;
      const xr = c.map((v, j) => v + (v - P[n][j])), fr = f(xr);
      if (fr < F[0]) { const xe = c.map((v, j) => v + 2 * (v - P[n][j])), fe = f(xe); if (fe < fr) { P[n] = xe; F[n] = fe; } else { P[n] = xr; F[n] = fr; } }
      else if (fr < F[n - 1]) { P[n] = xr; F[n] = fr; }
      else { const xc = c.map((v, j) => v + 0.5 * (P[n][j] - v)), fc = f(xc);
        if (fc < F[n]) { P[n] = xc; F[n] = fc; } else { for (let i = 1; i <= n; i++) { P[i] = P[i].map((v, j) => P[0][j] + 0.5 * (v - P[0][j])); F[i] = f(P[i]); } } }
    }
    const o = F.map((v, i) => i).sort((a, b) => F[a] - F[b]); return { x: P[o[0]], f: F[o[0]] };
  }
  const gammaFn = z => { // Lanczos
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gammaFn(1 - z));
    const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    z -= 1; let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i); const t = z + g + 0.5; return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
  };

  /* ---------- DSC normalization ---------- */
  // run: {T[], HF[]} (any order); r: {g:[T1,T2], l:[T3,T4]} in K. Returns sorted arrays and derived quantities.
  function defaultRanges(T) {
    const lo = Math.min(...T), hi = Math.max(...T), s = hi - lo;
    return { g: [lo + 0.05 * s, lo + 0.25 * s], l: [hi - 0.2 * s, hi - 0.03 * s] };
  }
  function normalize(run, r) {
    const { x: T, y: HF } = sortByX(run.T, run.HF);
    const gx = [], gy = [], lx = [], ly = [];
    T.forEach((t, i) => { if (inRange(t, r.g)) { gx.push(t); gy.push(HF[i]); } if (inRange(t, r.l)) { lx.push(t); ly.push(HF[i]); } });
    const fg = linfit(gx, gy), fl = linfit(lx, ly);
    if (!fg || !fl) return { ok: false, msg: "Each range needs at least two data points.", T, HF };
    const g = t => fg.a + fg.b * t, l = t => fl.a + fl.b * t;
    const cpN = T.map((t, i) => (HF[i] - g(t)) / (l(t) - g(t)));
    // T_f(T) = T* − ∫_T^{T*} C_p^N dT', with T* at the start of the liquid range (T_f = T above it)
    const Ts = Math.min(r.l[0], r.l[1]), Tf = new Array(T.length);
    let acc = 0, k = T.findIndex(t => t >= Ts); if (k < 0) k = T.length - 1;
    for (let i = T.length - 1; i >= 0; i--) {
      if (T[i] >= Ts) { Tf[i] = T[i]; continue; }
      const hiT = i + 1 < T.length ? Math.min(T[i + 1], Ts) : Ts, hiC = i + 1 < T.length && T[i + 1] <= Ts ? cpN[i + 1] : interp(T, cpN, Ts);
      acc += (hiT - T[i]) * (cpN[i] + hiC) / 2; Tf[i] = Ts - acc;
    }
    const Tg2 = Math.max(r.g[0], r.g[1]), TfPrime = interp(T, Tf, Tg2);
    // midpoint temperature (C_p^N = 0.5) inside the transition
    let Tmid = NaN; for (let i = 1; i < T.length; i++) if (T[i] > Tg2 && T[i - 1] < Ts && (cpN[i - 1] - 0.5) * (cpN[i] - 0.5) <= 0 && cpN[i] !== cpN[i - 1]) { Tmid = T[i - 1] + (0.5 - cpN[i - 1]) * (T[i] - T[i - 1]) / (cpN[i] - cpN[i - 1]); break; }

  /* ================= TAB 2: enthalpy recovery ================= */
  function recState() {
    const heats = A.runs.map((r, i) => i).filter(i => A.runs[i].kind === "heat");
    let ref = A.rec.ref; if (!heats.includes(ref)) ref = heats.find(i => !(A.runs[i].ta > 0)); if (ref === undefined) ref = heats[0];
    A.rec.ref = ref === undefined ? -1 : ref;
    const R = A.runs[A.rec.ref], aged = heats.filter(i => i !== A.rec.ref && A.runs[i].ta > 0).sort((a, b) => A.runs[a].ta - A.runs[b].ta);
    if (!R) return { heats, R: null, aged };
    const NR = norm(R); if (!NR.ok) return { heats, R, NR, aged, bad: true };
    const int = A.rec.int || [Math.min(...R.rg.g), Math.max(...R.rg.l)];
    const Ta = A.rec.Ta !== "" ? tK(+A.rec.Ta) : (aged.map(i => A.runs[i].Ta).find(isFinite));
    const dcpAuto = NR.dHF(NR.TfPrime) * hScale(R), dcp = A.rec.dcp !== "" ? +A.rec.dcp : dcpAuto;
    const res = aged.map(i => {
      const r = A.runs[i], N = norm(r); if (!N.ok) return { i, r, bad: true };
      const rc = AN.recovery(NR, N, { g: R.rg.g, l: R.rg.l, mode: A.rec.mode, int });
      const dH = rc.integral * hScale(R), dT = dH / dcp;
      const TfH = NR.TfPrime - dT, dHinf = isFinite(Ta) ? dcp * (NR.TfPrime - Ta) : NaN;
      return { i, r, N, rc, dH, dT, TfH, phi: isFinite(dHinf) ? 1 - dH / dHinf : NaN, dHinf };
    });
    const ok = res.filter(x => !x.bad && isFinite(x.phi));
    const kww = ok.length >= 3 ? AN.kwwFit(ok.map(x => x.r.ta), ok.map(x => x.phi)) : null;
    return { heats, R, NR, aged, int, Ta, dcp, dcpAuto, res, kww };
  }

  /* ================= projects (shared/project.js) ================= */
  async function needProject() {
    if (!window.GP) return null;

  }
  const rawRun = r => ({ name: r.name, kind: r.kind, q: r.q, mass: r.mass, hfUnit: r.hfUnit, ta: r.ta, Ta: r.Ta, T: r.T, HF: r.HF, rg: r.rg });

    await GP.addItem({ type: "an-session", key: "session", name: "Data Analysis session", summary: `${A.runs.length} heat-flow run(s), ${A.vols.length} relaxation dataset(s)`,
      data: { runs: A.runs.map(rawRun), rec: A.rec, vols: A.vols.map(v => ({ name: v.name, pu: v.pu, Ta: v.Ta, t: v.t, v: v.v, vinfMode: v.vinfMode, vinf: v.vinf })), sel: A.sel, vsel: A.vsel, unit: A.unit } });
  }
  async function saveRuns() {
    const p = await needProject(); if (!p) return; let n = 0;
    for (const r of A.runs) {
      const N = norm(r); if (!N.ok) continue;
      await GP.addItem({ type: "cp-normalized", key: r.name, name: r.name,
        summary: `${kindLabel(r)} · ${nf(r.q, 3)} K/min · T_f′ = ${nf(N.TfPrime, 5)} K${r.ta > 0 ? ` · annealed ${nf(r.ta, 3)} s` : ""}`,
        data: { name: r.name, kind: r.kind, q: r.q, mass: r.mass, hfUnit: r.hfUnit, ta: r.ta, Ta: isFinite(r.Ta) ? r.Ta : null,
          T: N.T, HF: N.HF, cpN: N.cpN, Tf: N.Tf, TfPrime: N.TfPrime, Tmid: isFinite(N.Tmid) ? N.Tmid : null, dCp: N.dHF(N.TfPrime) * hScale(r), cpUnit: cpUnit(r),
          baseline: { glass: { range: r.rg.g.slice(), a: N.fg.a, b: N.fg.b }, liquid: { range: r.rg.l.slice(), a: N.fl.a, b: N.fl.b }, form: "HF = a + b·T (T in K)" } } });

    GP.toast(`Saved ${n} normalized run${n === 1 ? "" : "s"} and the session to “${p.name}”`);
  }

        rows: ok.map(x => ({ ta: x.r.ta, dH: x.dH, dT: x.dT, TfH: x.TfH, TfArea: x.N.TfPrime, phi: isFinite(x.phi) ? x.phi : null, run: x.r.name })) } });
