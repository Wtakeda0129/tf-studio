<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GARASU Beta · Data Analysis</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>

:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#dfe3e9; --grid:#e9ecf1; --soft:#f7f8fa;
  --accent:#2a6fdb; --accent-ink:#ffffff; --eq:#7a8696; --warn:#b42318; --warnbg:#fdecea; --ok:#1f7a3a; --okbg:#e8f5ec;
  --c1:#2a6fdb; --c2:#d9480f; --c3:#2b9348; --c4:#8e44ad; --c5:#b8860b; --c6:#0e8f9c; --c7:#c2185b; --c8:#546e7a;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e6ebf2; --muted:#93a1b3; --line:#2c3543; --grid:#252d39; --soft:#161b22;
  --accent:#5b9bff; --accent-ink:#0b1220; --eq:#8b98a9; --warn:#ff8f85; --warnbg:#3a1d1b; --ok:#6fd48b; --okbg:#173022;
  --c1:#5b9bff; --c2:#ff8a4c; --c3:#5fd17f; --c4:#c08be0; --c5:#e3b341; --c6:#4fd0dc; --c7:#f06292; --c8:#90a4ae; --shadow:none;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:2px 8px;font-size:12px} .btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.btn.icon{padding:1px 6px;font-size:13px;line-height:1.3}
header{display:flex;align-items:center;gap:14px;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15.5px;margin:0;font-weight:680}
.brand{display:flex;align-items:baseline;gap:7px;color:inherit;text-decoration:none}.brand span{font-size:12.5px;color:var(--muted);font-weight:600}
header .sp{flex:1}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 12px 4px 5px;cursor:pointer;text-align:left;min-width:150px}
.step .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--soft);border:1px solid var(--line)}
.step b{display:block;font-size:12.5px} .step small{display:block;color:var(--muted);font-size:11px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step[aria-current=true] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.done .num{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.menu{position:relative} .menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;z-index:30;min-width:260px;display:none}
.menu.open>div{display:block}
.menu button.item{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:6px;cursor:pointer}
.menu button.item:hover{background:var(--soft)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 0}
main{flex:1;display:grid;grid-template-columns:390px minmax(0,1fr);gap:12px;padding:10px 14px;min-height:0}
@media (min-width:981px){ body{height:100vh;overflow:hidden} #left,#right{overflow-y:auto;min-height:0} #left{padding-right:4px;scrollbar-gutter:stable} }
@media (max-width:980px){ main{grid-template-columns:1fr} .step{min-width:0} .step small{display:none} header{flex-wrap:wrap} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:10px}
.card>h2{margin:0;padding:8px 12px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>h2 .sub{text-transform:none;letter-spacing:0;font-weight:500}
.card .body{padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 8px} .full{grid-column:1/-1}
label.f{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
label.f>input,label.f>select,label.f>textarea,label.f>.inrow{display:block;margin-top:3px;width:100%}
input[type=number],input[type=text],select,textarea{padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13px;min-width:0}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
input[type=range]{accent-color:var(--accent);width:100%;margin:0}
.inrow{display:flex;gap:6px;align-items:center} .inrow>input[type=number]{width:74px;flex:1 1 60px;min-width:0} .inrow>input[type=range]{flex:1}
.inrow>select{flex:none;width:auto}
.note{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;color:#fff;background:var(--pc)}
/* segments */
.seg{border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:9px;padding:7px 9px 8px;margin-bottom:7px;background:var(--panel)}
.seg.sel{box-shadow:0 0 0 1.5px var(--pc)}
.seg .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.seg .top .desc{font-size:12px;color:var(--ink);font-weight:550;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.seg .res{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:5px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel)} .stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums} .stat span{font-size:10.5px;color:var(--muted)}
/* datasets */
.dsitem{border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:9px;padding:6px 9px;margin-bottom:6px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center}
.dsitem.sel{box-shadow:0 0 0 1.5px var(--pc)} .dsitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dsitem .meta{grid-column:2/4;font-size:11px;color:var(--muted)}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 8px}
.tabs2 button{border:none;background:none;padding:5px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;font-size:12px}
.tabs2 button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
/* params */
table.pt{width:100%;border-collapse:collapse;font-size:12.5px}
table.pt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
table.pt td{padding:3px 4px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.pt td input[type=number]{width:100%;font-size:12px;padding:3px 5px}
table.pt tr.fixed td input.b{opacity:.35}
table.pt .nm{white-space:nowrap}
table.pt td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{font-size:10.5px;color:var(--warn);font-weight:650}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;align-items:start}
.mcard input{margin-top:3px;accent-color:var(--accent)} .mcard b{font-size:12.5px} .mcard span{grid-column:2;font-size:11.5px;color:var(--muted)}
.mcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
/* right panel */
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rhead h3{margin:0;font-size:14px}
.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:1250px){.plots{grid-template-columns:1fr}}
@media (min-width:1900px){.plots.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plotcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;position:relative;min-width:0}
.plotcard h3{margin:0 0 2px;font-size:12.5px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:6px}
.plotcard svg{width:100%;height:auto;display:block;overflow:visible}
.plotbox,.resbox{position:relative}
.plotcard .plotbox svg{max-height:max(220px,calc((100vh - 330px)/2))}
.plotcard .resbox svg{max-height:120px}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:4px}
.legend i.dash{border-top-style:dashed} .legend i.dot{width:7px;height:7px;border-radius:50%;border:none;background:currentColor}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:5;display:none}
.axis text{fill:var(--muted);font-size:11px} .axlabel{fill:var(--ink);font-size:12px}
.empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.banner{padding:7px 11px;border-radius:8px;margin-bottom:8px;font-weight:550}
.banner.err{background:var(--warnbg);color:var(--warn)} .banner.ok{background:var(--okbg);color:var(--ok)}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px} .progress>div{height:100%;background:var(--accent);width:0;transition:width .15s}
.navbar{display:flex;justify-content:space-between;gap:8px;margin:4px 0 12px}
table.dt{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums} table.dt td,table.dt th{padding:2px 8px;border-bottom:1px solid var(--grid);text-align:right} table.dt th{color:var(--muted);font-weight:600}
table.metrics{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.metrics th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
table.metrics td{padding:3px 4px;border-bottom:1px solid var(--grid)} table.metrics td.num{text-align:right}
table.corr{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums} table.corr td,table.corr th{padding:4px 7px;text-align:center} table.corr th{color:var(--muted);font-weight:600}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.eqn{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;background:var(--soft);border-radius:7px;padding:7px 9px;margin-top:6px;overflow-x:auto;white-space:pre}
.plotcard.wide{grid-column:1/-1}
.cbar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:0 8px 6px 56px;flex-wrap:wrap}
.cbar i{display:inline-block;width:180px;height:10px;border-radius:2px}
.brand{flex-shrink:0}.brand h1{white-space:nowrap}
.beta-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:middle;line-height:1.5;align-self:center}

.dsitem .pill{min-width:34px;text-align:center}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" title="GARASU home"><h1>GARASU</h1><b class="beta-badge" title="Beta: still in development">Beta</b><span>Data Analysis</span></a>
  <nav class="stepper">
    <button class="step" data-tab="1"><span class="num">1</span><span><b>Heat-flow scans</b><small id="st1">upload DSC heat flow</small></span></button>
    <button class="step" data-tab="2"><span class="num">2</span><span><b>Enthalpy recovery</b><small id="st2">heating after annealing</small></span></button>
    <button class="step" data-tab="3"><span class="num">3</span><span><b>Property relaxation</b><small id="st3">volume, density, length…</small></span></button>
  </nav>
  <span class="sp"></span>
  <a class="btn small" href="fitter.html" data-tool="fitter" style="text-decoration:none">Fitter →</a>
  <label class="chk" title="Unit for every temperature">Temperature <select id="unit"><option value="K">K</option><option value="C">°C</option></select></label>
  <label class="chk" title="Time axis of all time plots">Time axis <select id="tscale"><option value="log">log</option><option value="lin">linear</option></select></label>
  <button class="btn small" id="themeBtn" title="Light / dark">◐</button>
</header>
<main>
  <section id="left"></section>
  <section id="right"></section>
</main>
<script>
// ---------- plotting (SVG, no dependencies) ----------
let PLOT_UID=0;
const NS="http://www.w3.org/2000/svg";
function niceTicks(lo,hi,target){
  if(!(hi>lo)){hi=lo+1;}
  const span=hi-lo, raw=span/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), r=raw/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag, out=[];
  const start=Math.ceil(lo/step-1e-9), n=Math.floor(hi/step+1e-9)-start;
  // a span that is tiny relative to the values (or non-finite) would give endless ticks: fall back to the two ends
  if(!isFinite(step)||!(step>0)||!isFinite(n)||n>1000||step<Math.max(Math.abs(lo),Math.abs(hi))*1e-12) return [lo,hi];
  for(let i=0;i<=n;i++){const v=(start+i)*step; out.push(Math.abs(v)<step*1e-6?0:+v.toPrecision(12));}
  return out;
}
function fmt(v){ if(v===0)return "0"; const a=Math.abs(v); if(a>=1e5||a<1e-3) return v.toExponential(1).replace("e+","e"); return +v.toPrecision(4)+""; }
function plot(el,cfg){
  // cfg: {title,xlabel,ylabel,series:[{name,x,y,color,dash,w,pts}],ylog,xlog,ydom,xdom,id}
  const W=cfg.W||560,H=cfg.H||310,m={l:cfg.ml||56,r:12,t:8,b:cfg.xlabel===""?22:40}; const uid="c"+(++PLOT_UID);
  const S=cfg.series.filter(s=>s.x&&s.x.length);
  let xs=[],ys=[];
  S.forEach(s=>{for(let i=0;i<s.x.length;i++){const X=s.x[i],Y=s.y[i]; if(isFinite(X)&&isFinite(Y)&&(!cfg.ylog||Y>0)&&(!cfg.xlog||X>0)&&(!cfg.xdom||(X>=cfg.xdom[0]&&X<=cfg.xdom[1]))){xs.push(X);ys.push(Y);}}});
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(!xs.length){xmin=0;xmax=1;ymin=0;ymax=1;}
  if(cfg.xdom){[xmin,xmax]=cfg.xdom;} if(cfg.ydom){[ymin,ymax]=cfg.ydom;}
  // a (nearly) constant series: open the range around it instead of zooming into rounding noise
  const flatRange=(a,b)=>!(b-a>1e-9*Math.max(Math.abs(a),Math.abs(b)));
  if(!cfg.xdom&&!cfg.xlog&&flatRange(xmin,xmax)){const c=(xmin+xmax)/2,d=Math.abs(c)>1e-6?Math.abs(c)*0.01:0.5;xmin=c-d;xmax=c+d;}
  if(!cfg.ydom&&!cfg.ylog&&flatRange(ymin,ymax)){const c=(ymin+ymax)/2,d=Math.abs(c)>1e-6?Math.abs(c)*0.01:0.5;ymin=c-d;ymax=c+d;}
  const padY=(ymax-ymin)*0.05||1; if(!cfg.ydom&&!cfg.ylog){ymin-=padY;ymax+=padY;}
  const fx=cfg.xlog?Math.log10:(v=>v), fy=cfg.ylog?Math.log10:(v=>v);
  let X0=fx(xmin),X1=fx(xmax),Y0=fy(ymin),Y1=fy(ymax);
  if(cfg.ylog&&!cfg.ydom){Y0=Math.floor(Y0);Y1=Math.ceil(Y1);} if(cfg.xlog&&!cfg.xdom){X0=Math.floor(X0);X1=Math.ceil(X1);}
  // log axis without any positive value (or overflowing values): fall back to one decade instead of an unbounded axis
  if(!isFinite(X0)||!isFinite(X1)){X0=0;X1=1;} if(!isFinite(Y0)||!isFinite(Y1)){Y0=0;Y1=1;}
  if(X1===X0)X1=X0+1; if(Y1===Y0)Y1=Y0+1;
  const sx=v=>m.l+(fx(v)-X0)/(X1-X0)*(W-m.l-m.r), sy=v=>H-m.b-(fy(v)-Y0)/(Y1-Y0)*(H-m.t-m.b);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" data-xscale="${cfg.xlog?"log":"lin"}" aria-label="${cfg.title}"><g class="axis">`;
  const xt=cfg.xlog?range(Math.ceil(X0),Math.floor(X1)).map(e=>Math.pow(10,e)):niceTicks(X0,X1,6);
  const yt=cfg.ylog?range(Math.ceil(Y0),Math.floor(Y1)).map(e=>Math.pow(10,e)):niceTicks(Y0,Y1,6);
  xt.forEach(v=>{const x=sx(v); if(x<m.l-1||x>W-m.r+1)return; if(cfg.xlabel===""){g+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}" stroke="var(--grid)"/>`;return;} g+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}" stroke="var(--grid)"/><text x="${x}" y="${H-m.b+15}" text-anchor="middle">${cfg.xlog?"1e"+Math.round(Math.log10(v)):fmt(v)}</text>`;});
  yt.forEach(v=>{const y=sy(v); if(y<m.t-1||y>H-m.b+1)return; g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y+3.5}" text-anchor="end">${cfg.ylog?"1e"+Math.round(Math.log10(v)):fmt(v)}</text>`;});
  g+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="none" stroke="var(--line)"/></g>`;
  // bands (e.g. highlighted segment)
  (cfg.bands||[]).forEach(b=>{const a=Math.max(m.l,sx(b.x0)),c=Math.min(W-m.r,sx(b.x1)); if(c>a) g+=`<rect x="${a}" y="${m.t}" width="${c-a}" height="${H-m.t-m.b}" fill="${b.color}" opacity="${b.op||0.12}"/>`;});
  g+=`<clipPath id="${uid}"><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}"/></clipPath><g clip-path="url(#${uid})">`;
  // raster image in data coordinates (e.g. a colour map), drawn under the lines
  if(cfg.image){const im=cfg.image,a=sx(im.x0),b=sx(im.x1),c=sy(im.y1),d=sy(im.y0); g+=`<image href="${im.href}" x="${Math.min(a,b).toFixed(1)}" y="${Math.min(c,d).toFixed(1)}" width="${Math.abs(b-a).toFixed(1)}" height="${Math.abs(d-c).toFixed(1)}" preserveAspectRatio="none"/>`;}
  const flat=[];
  S.forEach((s,si)=>{
    if(s.pts){ for(let i=0;i<s.x.length;i++){ if(!isFinite(s.x[i])||!isFinite(s.y[i])||(cfg.xlog&&!(s.x[i]>0))||(cfg.ylog&&!(s.y[i]>0)))continue; g+=s.hollow?`<circle cx="${sx(s.x[i]).toFixed(1)}" cy="${sy(s.y[i]).toFixed(1)}" r="${s.r||2.6}" fill="none" stroke="${s.color}" stroke-width="1.2"/>`:`<circle cx="${sx(s.x[i]).toFixed(1)}" cy="${sy(s.y[i]).toFixed(1)}" r="${s.r||2.6}" fill="${s.color}" fill-opacity="${s.op||.75}"/>`; flat.push([sx(s.x[i]),sy(s.y[i]),si,i]); } return; }
    let d="",pen=false;
    for(let i=0;i<s.x.length;i++){
      const ok=isFinite(s.x[i])&&isFinite(s.y[i])&&(!cfg.ylog||s.y[i]>0)&&(!cfg.xlog||s.x[i]>0);

<script>
/* ============================================================
   GARASU · Data Analysis — numerical core (no DOM)
   - parse pasted / uploaded tables
   - DSC heat flow: linear glass and liquid baselines → normalized C_p^N = (HF − HF_g)/(HF_l − HF_g),

   ============================================================ */
const AN = (function () {
  /* ---------- tables ---------- */
  function parseTable(text) {
    const rows = [], lines = String(text || "").split(/\r?\n/);
    let names = null;
    for (const raw of lines) {
      const line = raw.trim(); if (!line) continue;
      // delimiters: comma, semicolon or tab when present (headers may contain spaces), otherwise whitespace

  }

  /* ---------- small numerics ---------- */
  function linfit(x, y) {   // y = a + b x

    for (let i = 0; i < x.length; i++) { const X = x[i], Y = y[i]; if (!isFinite(X) || !isFinite(Y)) continue; n++; sx += X; sy += Y; sxx += X * X; sxy += X * Y; }

  }

    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= x) lo = m; else hi = m; }

  }

      else { const xc = c.map((v, j) => v + 0.5 * (P[n][j] - v)), fc = f(xc);

  // run: {T[], HF[]} (any order); r: {g:[T1,T2], l:[T3,T4]} in K. Returns sorted arrays and derived quantities.

    const Ts = Math.min(r.l[0], r.l[1]), Tf = new Array(T.length);

  }

  // ref, aged: normalize() results (heating scans at the same rate). o: {g, l, mode: "liquid"|"linear", int:[a,b]}

  function kwwFit(t, phi) {

  function relaxFit(t, v, vinfFixed) {

<script>

(function () {
  "use strict";
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

  function hUnit(r) { return r.hfUnit === "W/g" || (r.hfUnit === "mW" && r.mass > 0) ? "J/g" : r.hfUnit === "mW" ? "mJ" : `${r.hfUnit || "a.u."}·s`; }

  function norm(r) { if (!r._N || r._Nkey !== JSON.stringify(r.rg)) { r._N = AN.normalize(r, r.rg); r._Nkey = JSON.stringify(r.rg); } return r._N; }

  function renderTabs() {

  function render() { renderTabs(); [null, renderLeft1, renderLeft2, renderLeft3][A.tab](); renderRight(); }

  function autoKind(ed) { const p = ed.parsed; if (!p) return "–"; const x = p.cols[+ed.xcol] || []; const a = x.find(isFinite), b = [...x].reverse().find(isFinite); return b >= a ? "heating" : "cooling"; }

  /* ================= TAB 2: enthalpy recovery ================= */
  function recState() {
    const heats = A.runs.map((r, i) => i).filter(i => A.runs[i].kind === "heat");
    let ref = A.rec.ref; if (!heats.includes(ref)) ref = heats.find(i => !(A.runs[i].ta > 0)); if (ref === undefined) ref = heats[0];
    A.rec.ref = ref === undefined ? -1 : ref;
    const R = A.runs[A.rec.ref], aged = heats.filter(i => i !== A.rec.ref && A.runs[i].ta > 0).sort((a, b) => A.runs[a].ta - A.runs[b].ta);
    if (!R) return { heats, R: null, aged };
    const NR = norm(R); if (!NR.ok) return { heats, R, NR, aged, bad: true };
    const int = A.rec.int || [Math.min(...R.rg.g), Math.max(...R.rg.l)];
    const Ta = A.rec.Ta !== "" ? tK(+A.rec.Ta) : (aged.map(i => A.runs[i].Ta).find(isFinite));
    const dcpAuto = NR.dHF(NR.TfPrime) * hScale(R), dcp = A.rec.dcp !== "" ? +A.rec.dcp : dcpAuto;
    const res = aged.map(i => {
      const r = A.runs[i], N = norm(r); if (!N.ok) return { i, r, bad: true };
      const rc = AN.recovery(NR, N, { g: R.rg.g, l: R.rg.l, mode: A.rec.mode, int });
      const dH = rc.integral * hScale(R), dT = dH / dcp;
      const TfH = NR.TfPrime - dT, dHinf = isFinite(Ta) ? dcp * (NR.TfPrime - Ta) : NaN;
      return { i, r, N, rc, dH, dT, TfH, phi: isFinite(dHinf) ? 1 - dH / dHinf : NaN, dHinf };
    });
    const ok = res.filter(x => !x.bad && isFinite(x.phi));
    const kww = ok.length >= 3 ? AN.kwwFit(ok.map(x => x.r.ta), ok.map(x => x.phi)) : null;
    return { heats, R, NR, aged, int, Ta, dcp, dcpAuto, res, kww };
  }

      fitCard = `<div class="card"><h2>Stretched-exponential fit <span class="sub">${esc(v.name)}</span></h2><div class="body">
        <div class="eqn">${esc(v.pu.split(" (")[0] || "V")}(t) = V∞ + (V₀ − V∞)·exp[−(t/τ)^β]</div>
        <div class="grid2" style="margin-top:8px"><label class="f">Equilibrium value V∞<select id="vinfMode"><option value="free" ${v.vinfMode !== "fixed" ? "selected" : ""}>fitted</option><option value="fixed" ${v.vinfMode === "fixed" ? "selected" : ""}>fixed at</option></select></label>
          <label class="f">V∞ value<input type="number" id="vinfVal" value="${v.vinf}" step="any" ${v.vinfMode === "fixed" ? "" : "disabled"}></label></div>
        ${F ? `<table class="metrics" style="margin-top:8px"><tr><th>parameter</th><th>value</th></tr>
          <tr><td>τ (KWW)</td><td class="num">${nf(F.tau, 4)} s</td></tr><tr><td>β</td><td class="num">${nf(F.beta, 3)}</td></tr><tr><td>⟨τ⟩ = (τ/β) Γ(1/β)</td><td class="num">${nf(F.meanTau, 4)} s</td></tr>
          <tr><td>V₀ (t = 0)</td><td class="num">${nf(F.v0, 7)}</td></tr><tr><td>V∞</td><td class="num">${nf(F.vinf, 7)}</td></tr><tr><td>V₀ − V∞ (relative)</td><td class="num">${nf(F.dv, 4)} (${nf(F.dv / F.vinf * 100, 3)} %)</td></tr>
          <tr><td>R²</td><td class="num">${nf(F.R2, 6)}</td></tr></table>` : `<div class="banner err" style="margin-top:8px">The fit needs at least four points.</div>`}
        <p class="note">φ(t) = (V − V∞)/(V₀ − V∞) is the relaxation function, directly comparable with φ(t<sub>a</sub>) from enthalpy recovery (tab 2) and with the Fitter's "annealing" data.</p>
        <div class="row" style="margin-top:6px"><button class="btn small" id="csv3">Export data, φ and fit (.csv)</button></div>
      </div></div>`;
    }
    $("#left").innerHTML = `
      <div class="card"><h2>Relaxation datasets <span class="sub">${A.vols.length}</span></h2><div class="body">
        ${A.vols.length ? list : `<p class="note" style="margin-top:0">Upload a property measured during isothermal annealing: volume, density, length, refractive index… against time.</p>`}
        <div class="row" style="margin-top:6px"><button class="btn small" id="addVol">+ Add dataset</button><button class="btn small" id="exVol">Load example data</button></div>
      </div></div>
      ${A.ved ? `<div class="card"><h2>Add a relaxation dataset</h2><div class="body">${editorHTML(A.ved, "vol")}</div></div>` : ""}
      ${fitCard}`;
  }
  function renderRight3() {
    const v = A.vols[A.vsel];
    if (!v) { $("#right").innerHTML = `<div class="rhead"><h3>Property relaxation</h3></div>${empty("Add a dataset or load the example (specific volume of selenium during annealing, computed with the TL model).")}`; return; }
    $("#right").innerHTML = `<div class="rhead"><h3>${esc(v.name)}</h3></div><div class="plots">${card("a3v")}${card("a3phi")}${card("a3r")}</div>`;
    const F = vfit(v), c = col(A.vsel), tmax = Math.max(...v.t), tmin = Math.min(...v.t.filter(t => t > 0));
    const tt = A.logt ? logspace(tmin, tmax, 200) : Array.from({ length: 200 }, (_, k) => tmax * k / 199);
    const s1 = [{ name: "data", x: v.t, y: v.v, color: c, pts: true, r: 2.6 }];
    if (F) s1.push({ name: `fit: τ = ${nf(F.tau, 3)} s, β = ${nf(F.beta, 3)}`, x: tt, y: tt.map(t => F.vinf + F.dv * Math.exp(-Math.pow(t / F.tau, F.beta))), color: css("--ink"), w: 1.6 }, { name: "V∞", x: [tt[0], tt[tt.length - 1]], y: [F.vinf, F.vinf], color: css("--eq"), w: 1, dash: "4 3" });
    P("a3v", { title: `${v.pu} during annealing${isFinite(v.Ta) ? ` at ${nf(tU(v.Ta), 5)} ${uL()}` : ""}`, xlabel: "time (s)", ylabel: v.pu, xlog: A.logt, series: s1, xshort: "t", yshort: "V" });
    const s2 = [];
    A.vols.forEach((w, i) => { const G = vfit(w); if (!G) return; s2.push({ name: w.name, x: w.t, y: w.v.map(y => (y - G.vinf) / G.dv), color: col(i), pts: true, r: i === A.vsel ? 2.8 : 2 });
      const ts = A.logt ? logspace(Math.min(...w.t.filter(t => t > 0)), Math.max(...w.t), 150) : Array.from({ length: 150 }, (_, k) => Math.max(...w.t) * k / 149);
      s2.push({ name: "", x: ts, y: ts.map(t => Math.exp(-Math.pow(t / G.tau, G.beta))), color: col(i), w: 1.4 }); });
    P("a3phi", { title: "Relaxation function φ(t) = (V − V∞)/(V₀ − V∞), all datasets", xlabel: "time (s)", ylabel: "φ", xlog: A.logt, series: s2, xshort: "t", yshort: "φ" });
    if (F) P("a3r", { title: "Residuals of the fit", xlabel: "time (s)", ylabel: "residual", xlog: A.logt, series: [{ name: "", x: [tt[0] || tmin, tmax], y: [0, 0], color: css("--eq"), w: 1, dash: "3 3" }, { name: "", x: v.t, y: v.v.map((y, k) => y - (F.vinf + F.dv * Math.exp(-Math.pow(v.t[k] / F.tau, F.beta)))), color: c, pts: true, r: 2.2 }], xshort: "t", yshort: "res" });
  }
  function addVolFromEditor() {
    const ed = A.ved, p = ed.parsed, msg = $("#edMsg"); if (!p) return;
    const t = [], v = []; p.cols[+ed.xcol].forEach((x, i) => { const y = p.cols[+ed.ycol][i]; if (isFinite(x) && isFinite(y)) { t.push(x * TIME[ed.xu]); v.push(y); } });
    if (t.length < 4) { msg.textContent = "Fewer than four usable rows."; return; }
    const o = t.map((_, i) => i).sort((a, b) => t[a] - t[b]);
    A.vols.push({ name: ed.name || `${ed.pu || "Property"} relaxation`, pu: ed.pu || "V", Ta: ed.TaT === "" ? NaN : tK(+ed.TaT), t: o.map(i => t[i]), v: o.map(i => v[i]), vinfMode: "free", vinf: "" });
    A.vsel = A.vols.length - 1; A.ved = null; render();
  }
  function exportVol() {
    const v = A.vols[A.vsel]; if (!v) return; const F = vfit(v); const rows = ["t_s,value,phi,fit"];
    v.t.forEach((t, k) => rows.push([t, v.v[k], F ? (v.v[k] - F.vinf) / F.dv : "", F ? F.vinf + F.dv * Math.exp(-Math.pow(t / F.tau, F.beta)) : ""].join(",")));
    dl(new Blob([rows.join("\n")], { type: "text/csv" }), "relaxation_fit.csv");
  }

  /* ================= events ================= */
  document.addEventListener("click", e => {
    const t = e.target.closest("button,[data-sel],[data-vsel]"); if (!t) return;
    if (t.dataset.tab) { A.tab = +t.dataset.tab; render(); return; }
    if (t.id === "themeBtn") { const r = document.documentElement; r.dataset.theme = (r.dataset.theme || "light") === "dark" ? "light" : "dark"; renderRight(); return; }
    // tab 1
    if (t.id === "addRun") { A.ed = newHfEditor(); renderLeft1(); return; }
    if (t.id === "exRuns") { loadExampleRuns(); if (A.tab !== 1) render(); return; }
    if (t.id === "edCancel") { A.ed = null; A.ved = null; render(); return; }
    if (t.id === "edAdd") { if (A.tab === 3) addVolFromEditor(); else addRunFromEditor(); return; }
    if (t.dataset.del !== undefined) { e.stopPropagation(); A.runs.splice(+t.dataset.del, 1); A.sel = Math.min(A.sel, A.runs.length - 1); render(); return; }
    if (t.dataset.sel !== undefined) { A.sel = +t.dataset.sel; render(); return; }
    if (t.id === "rgAuto") { const r = A.runs[A.sel]; r.rg = AN.defaultRanges(r.T); render(); return; }
    if (t.id === "rgAll") { const r = A.runs[A.sel]; A.runs.forEach(x => { x.rg = JSON.parse(JSON.stringify(r.rg)); }); render(); return; }
    if (t.id === "csv1") { exportNorm(); return; }
    // tab 2
    if (t.id === "csv2") { exportRec(false); return; } if (t.id === "csv2c") { exportRec(true); return; }
    // tab 3
    if (t.id === "addVol") { A.ved = newVolEditor(); renderLeft3(); return; }
    if (t.id === "exVol") { EXAMPLES.volume.forEach(x => A.vols.push({ name: x.name, pu: `v (${x.unit})`, Ta: x.Ta, t: x.t.slice(), v: x.v.slice(), vinfMode: "free", vinf: "" })); A.vsel = A.vols.length - 1; render(); return; }
    if (t.dataset.vdel !== undefined) { e.stopPropagation(); A.vols.splice(+t.dataset.vdel, 1); A.vsel = Math.min(A.vsel, A.vols.length - 1); render(); return; }
    if (t.dataset.vsel !== undefined) { A.vsel = +t.dataset.vsel; render(); return; }
    if (t.id === "csv3") { exportVol(); return; }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "unit") { A.unit = t.value; render(); return; }
    if (t.id === "tscale") { A.logt = t.value === "log"; renderRight(); return; }
    if (t.id === "edFile") { const f = t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const ed = A.tab === 3 ? A.ved : A.ed; setText(ed, rd.result, A.tab === 3 ? "vol" : "hf"); if (!ed.name) ed.name = f.name.replace(/\.[^.]+$/, ""); A.tab === 3 ? renderLeft3() : renderLeft1(); }; rd.readAsText(f); return; }
    const ed = A.tab === 3 ? A.ved : A.ed;
    if (ed) {
      const map = { edX: "xcol", edY: "ycol", edXU: "xu", edYU: "yu", edSign: "sign", edKind: "kind" };
      if (map[t.id]) { ed[map[t.id]] = t.value; A.tab === 3 ? renderLeft3() : renderLeft1(); return; }
    }
    if (t.id === "recRef") { A.rec.ref = +t.value; A.rec.int = null; render(); return; }
    if (t.id === "recMode") { A.rec.mode = t.value; render(); return; }
    if (t.id === "vinfMode") { const v = A.vols[A.vsel]; v.vinfMode = t.value; if (t.value === "fixed" && v.vinf === "") { const F = vfit(v); v.vinf = F ? +F.vinf.toPrecision(7) : ""; } render(); return; }
  });
  document.addEventListener("input", e => {
    const t = e.target, ed = A.tab === 3 ? A.ved : A.ed;
    if (t.id === "edText" && ed) { setText(ed, t.value, A.tab === 3 ? "vol" : "hf"); const box = t.closest(".body"); const keep = t.selectionStart; (A.tab === 3 ? renderLeft3 : renderLeft1)(); const nt = $("#edText"); if (nt) { nt.focus(); nt.selectionStart = nt.selectionEnd = keep; } return; }
    if (ed) { const map = { edQ: "q", edM: "m", edTa: "ta", edTaT: "TaT", edName: "name", edPU: "pu" }; if (map[t.id]) { ed[map[t.id]] = t.value; return; } }
    if (t.dataset.rg) { const v = parseFloat(t.value); if (!isFinite(v)) return; const r = A.runs[A.sel], k = t.dataset.rg; r.rg[k[0]][+k[1]] = tK(v); r._N = null; renderRight1(); refreshStats1(); return; }
    if (t.dataset.ta) { const v = parseFloat(t.value); A.runs[+t.dataset.ta].ta = isFinite(v) && v > 0 ? v : 0; renderTabs(); debounce(() => { renderLeft2Keep(); renderRight2(); }); return; }
    if (t.id === "int0" || t.id === "int1") { const S2 = recState(), v = parseFloat(t.value); if (!isFinite(v) || !S2.int) return; const a = S2.int.slice(); a[t.id === "int0" ? 0 : 1] = tK(v); A.rec.int = a; debounce(() => { renderLeft2Keep(); renderRight2(); }); return; }
    if (t.id === "recTa") { A.rec.Ta = t.value; debounce(() => { renderLeft2Keep(); renderRight2(); }); return; }
    if (t.id === "recDcp") { A.rec.dcp = t.value; debounce(() => { renderLeft2Keep(); renderRight2(); }); return; }
    if (t.id === "vinfVal") { const v = A.vols[A.vsel]; v.vinf = t.value; debounce(() => { renderLeft3Keep(); renderRight3(); }); return; }
  });
  let tmr = null; const debounce = f => { clearTimeout(tmr); tmr = setTimeout(f, 250); };
  // re-render the left panel without losing the focused input
  function keepFocus(fn) { const a = document.activeElement, id = a && a.id, ds = a && Object.entries(a.dataset || {})[0], pos = a && a.selectionStart; fn(); let el = id ? document.getElementById(id) : ds ? document.querySelector(`[data-${ds[0]}="${ds[1]}"]`) : null; if (el) { el.focus(); try { el.selectionStart = el.selectionEnd = pos; } catch (e) {} } }
  const renderLeft2Keep = () => keepFocus(renderLeft2), renderLeft3Keep = () => keepFocus(renderLeft3);
  function refreshStats1() { keepFocus(renderLeft1); }

  if (window.desktop) document.querySelectorAll("[data-tool]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); window.desktop.openTool(a.dataset.tool); }));
  render();
})();

</script>
</body>
</html>
